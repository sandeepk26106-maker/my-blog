<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — MyBlog</title>
  <meta name="description" content="About MyBlog by HIGH BLOGGING — who we are, what we write about, our authors and contact details." />
  <link rel="stylesheet" href="../assets/theme.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="../assets/site.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const SITE = window.SITE;

function Header({ session }) {
  const [theme, setTheme] = useState(AuthStore.getTheme());
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    AuthStore.setTheme(theme);
  }, [theme]);
  return (
    <header className="header">
      <div className="container header-inner">
        <a className="logo" href="../index.html">MyBlog</a>
        <nav className="nav">
          <a href="../index.html">Home</a>
          <a href="../index.html#blog">Blog</a>
          <a href="about.html">About</a>
          <a href="#contact">Contact</a>
        </nav>
        <div className="spacer" />
        <button className="icon-btn" onClick={() => setTheme(t => (t === "light" ? "dark" : "light"))} title="Toggle theme">
          {theme === "light" ? "🌙" : "☀️"}
        </button>
        {session ? (
          <a className="auth-link" href="../auth/dashboard.html">Hi, {session.name.split(" ")[0]}</a>
        ) : (
          <a className="auth-link" href="../auth/auth.html">Login</a>
        )}
      </div>
    </header>
  );
}

function Stats() {
  return (
    <div className="stat-grid">
      {SITE.stats.map(s => (
        <div className="stat" key={s.label}>
          <b>{s.value}</b>
          <span>{s.label}</span>
        </div>
      ))}
    </div>
  );
}

function ContactCard() {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [message, setMessage] = useState("");
  const [msg, setMsg] = useState({ t: "", ok: true });

  const submit = (e) => {
    e.preventDefault();
    if (name.trim().length < 2) { setMsg({ t: "Enter your name.", ok: false }); return; }
    if (!AuthStore.isValidEmail(email)) { setMsg({ t: "Enter a valid email address.", ok: false }); return; }
    if (message.trim().length < 10) { setMsg({ t: "Message thoda detail me likho (10+ characters).", ok: false }); return; }
    setMsg({ t: "Thanks! Message mil gaya — hum jaldi reply karenge.", ok: true });
    setName(""); setEmail(""); setMessage("");
  };

  return (
    <div className="contact-card" id="contact">
      <h3>Contact us</h3>
      <div className="contact-owner">{SITE.owner}</div>

      <div className="contact-row">
        <span className="ico">📞</span>
        <div>
          <small>Phone</small>
          <a href={SITE.phoneHref}>{SITE.phone}</a>
        </div>
      </div>
      <div className="contact-row">
        <span className="ico">📍</span>
        <div>
          <small>Address</small>
          <span>{SITE.address}</span>
        </div>
      </div>
      <div className="contact-row">
        <span className="ico">📌</span>
        <div>
          <small>Pin code</small>
          <span>{SITE.pincode}</span>
        </div>
      </div>
      <div className="contact-row">
        <span className="ico">@</span>
        <div>
          <small>Email</small>
          <a href={"mailto:" + SITE.email}>{SITE.email}</a>
        </div>
      </div>

      <form onSubmit={submit} style={{ marginTop: "20px" }} noValidate>
        {msg.t && <div className={msg.ok ? "msg msg-ok" : "msg msg-err"} role="alert">{msg.t}</div>}
        <div className="field">
          <label htmlFor="c-name">Name</label>
          <input id="c-name" type="text" placeholder="Your name" value={name} onChange={e => setName(e.target.value)} />
        </div>
        <div className="field">
          <label htmlFor="c-email">Email</label>
          <input id="c-email" type="email" placeholder="you@example.com" value={email} onChange={e => setEmail(e.target.value)} />
        </div>
        <div className="field">
          <label htmlFor="c-msg">Message</label>
          <textarea id="c-msg" rows="4" placeholder="Kya batana hai?" value={message} onChange={e => setMessage(e.target.value)}
            style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid var(--border)", background: "var(--bg)", color: "var(--text)", fontSize: 15, fontFamily: "inherit" }} />
        </div>
        <button className="btn btn-block" type="submit">Send message</button>
      </form>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(AuthStore.getSession());

  useEffect(() => {
    const onStorage = (e) => { if (e.key === AuthStore.SESSION_KEY) setSession(AuthStore.getSession()); };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, []);

  return (
    <div>
      <Header session={session} />

      <main>
        <section className="about-hero container">
          <h1>About {SITE.name}</h1>
          <p>
            {SITE.owner} ke dwara ek free, ad-free tech blog — jahan React, CSS, JavaScript, UX,
            SEO aur DevOps ko Hinglish me, practical examples ke saath samjhaya jaata hai.
          </p>
        </section>

        <section className="about-block">
          <h2>Who we are</h2>
          <p>
            {SITE.owner} ek chhoti si writing team hai jo roz code karti hai aur wahi cheezein
            likhti hai jo kaam me aati hain. Koi copy-paste tutorial nahi — har article uss cheez
            se nikla hai jo actually ek project me use hui.
          </p>
          <p>
            Blog ka mission simple hai: <strong>technical knowledge ko free, practical aur
            padhne layak banana.</strong> Isliye har post me working code, common galtiyan aur
            "kab use karna hai" wala hissa zaroor hota hai.
          </p>

          <h2 style={{ marginTop: "28px" }}>What we write about</h2>
          <div className="topic-list">
            {SITE.topics.map(t => <span className="chip" key={t}>{t}</span>)}
          </div>
          <ul>
            <li><strong>React</strong> — components, hooks, state management aur real patterns</li>
            <li><strong>CSS</strong> — Grid, Flexbox, responsive layout aur dark mode</li>
            <li><strong>JavaScript</strong> — modern language features jo daily kaam bachate hain</li>
            <li><strong>UX</strong> — accessibility, theming aur design decisions</li>
            <li><strong>SEO</strong> — technical SEO jo developers khud kar sakte hain</li>
            <li><strong>DevOps</strong> — deploy, git workflow aur CI/CD</li>
            <li><strong>Writing</strong> — tech content likhne aur edit karne ki technique</li>
          </ul>

          <h2 style={{ marginTop: "28px" }}>By the numbers</h2>
          <Stats />

          <h2 style={{ marginTop: "28px" }}>Meet the authors</h2>
          <div className="author-grid">
            {SITE.authors.map(a => (
              <div className="author-card" key={a.name}>
                <div className="avatar">{a.initials}</div>
                <h3>{a.name}</h3>
                <div className="role">{a.role}</div>
                <p>{a.bio}</p>
              </div>
            ))}
          </div>
        </section>

        <section className="about-block" style={{ paddingTop: 0 }}>
          <ContactCard />
        </section>

        <section className="container" style={{ paddingBottom: "40px", textAlign: "center" }}>
          <a className="btn" href="../index.html#blog">📚 Latest articles padhein</a>
        </section>
      </main>

      <footer className="footer container">
        <div><b>{SITE.name}</b><br />© 2026 {SITE.owner}. All rights reserved.</div>
        <div>
          About<br />Categories<br />
          <a href={SITE.phoneHref}>{SITE.phone}</a>
        </div>
        <div>{SITE.address} — {SITE.pincode}</div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
