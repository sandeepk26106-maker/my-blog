<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBlog — Homepage</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/site.js"></script>
  <script src="blog-posts/posts.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const POSTS = window.BLOG_POSTS || [];
const SITE = window.SITE;

function Header({ session, query, setQuery }) {
  const [theme, setTheme] = useState(AuthStore.getTheme());
  const [showSearch, setShowSearch] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    AuthStore.setTheme(theme);
  }, [theme]);

  const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });

  return (
    <header className="header">
      <div className="container header-inner">
        <a className="logo" href="index.html">MyBlog</a>
        <nav className="nav">
          <a href="index.html">Home</a>
          <a href="#blog">Blog</a>
          <a href="#about">About</a>
          <a href="about/about.html">About page</a>
          <a href="#contact">Contact</a>
        </nav>
        <div className="spacer" />
        {showSearch && (
          <input aria-label="Search posts" placeholder="Search posts…" value={query}
            onChange={e => setQuery(e.target.value)}
            style={{ padding: "8px 12px", borderRadius: 8, border: "1px solid var(--border)", background: "var(--bg)", color: "var(--text)" }} />
        )}
        <button className="icon-btn" onClick={() => setShowSearch(s => !s)} title="Search posts">🔍</button>
        <button className="icon-btn" onClick={() => setTheme(t => (t === "light" ? "dark" : "light"))} title="Toggle theme">
          {theme === "light" ? "🌙" : "☀️"}
        </button>
        {session ? (
          <a className="auth-link" href="auth/dashboard.html">Hi, {session.name.split(" ")[0]}</a>
        ) : (
          <a className="auth-link" href="auth/auth.html">Login</a>
        )}
        <button className="btn" onClick={() => scrollTo("newsletter")}>Subscribe</button>
      </div>
    </header>
  );
}

function PostCard({ post }) {
  return (
    <a className="card" data-testid="post-card" href={"post.html?slug=" + post.slug} style={{ display: "block" }}>
      <img src={post.cover} alt={post.title} loading="lazy" />
      <div className="card-body">
        <span className="cat">{post.category}</span>
        <h3>{post.title}</h3>
        <p>{post.excerpt}</p>
        <div className="meta">{post.author} · {post.date} · {post.readTime} min read</div>
      </div>
    </a>
  );
}

function App() {
  const [query, setQuery] = useState("");
  const [email, setEmail] = useState("");
  const [msg, setMsg] = useState({ t: "", ok: true });
  const [session, setSession] = useState(AuthStore.getSession());

  useEffect(() => {
    const onStorage = (e) => {
      if (e.key === AuthStore.SESSION_KEY) setSession(AuthStore.getSession());
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, []);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return POSTS;
    return POSTS.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.excerpt.toLowerCase().includes(q) ||
      p.category.toLowerCase().includes(q) ||
      p.author.toLowerCase().includes(q)
    );
  }, [query]);

  const subscribe = (e) => {
    e.preventDefault();
    if (!AuthStore.isValidEmail(email)) {
      setMsg({ t: "Enter a valid email address.", ok: false });
      return;
    }
    setMsg({ t: "Subscribed successfully!", ok: true });
    setEmail("");
  };

  const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });

  return (
    <div>
      <Header session={session} query={query} setQuery={setQuery} />

      <section className="hero container">
        <h1>Welcome to MyBlog</h1>
        <p>Simple ideas on React, CSS and the web.</p>
        <button className="btn" onClick={() => scrollTo("posts")}>Start Reading</button>
      </section>

      <main id="posts" className="container">
        <h2 id="blog" className="section-title">Latest posts <span style={{ color: "var(--muted)", fontSize: "16px", fontWeight: "500" }}>({filtered.length})</span></h2>
        {filtered.length === 0 ? (
          <p className="empty">No posts match your search.</p>
        ) : (
          <div className="grid">
            {filtered.map(p => (
              <PostCard key={p.id} post={p} />
            ))}
          </div>
        )}
      </main>

      <section className="about">
        <div className="container">
          <div className="about-head">
            <h2>About {SITE.name}</h2>
            <p>
              {SITE.owner} ke dwara ek free, ad-free tech blog — jahan React, CSS, JavaScript,
              UX, SEO aur DevOps ko Hinglish me, practical examples ke saath samjhaya jaata hai.
            </p>
            <p style={{ marginTop: "10px" }}>
              <span className="about-owner">Mission:</span> technical knowledge ko free, practical
              aur padhne layak banana — har post me working code, common galtiyan aur
              "kab use karna hai" wala hissa.
            </p>
          </div>

          <div className="stat-grid">
            {SITE.stats.map(s => (
              <div className="stat" key={s.label}>
                <b>{s.value}</b>
                <span>{s.label}</span>
              </div>
            ))}
          </div>

          <h3 style={{ fontSize: "18px", marginBottom: "12px" }}>What we write about</h3>
          <div className="topic-list">
            {SITE.topics.map(t => <span className="chip" key={t}>{t}</span>)}
          </div>

          <h3 style={{ fontSize: "18px", marginBottom: "12px" }}>Meet the authors</h3>
          <div className="author-grid">
            {SITE.authors.map(a => (
              <div className="author-card" key={a.name}>
                <div className="avatar">{a.initials}</div>
                <h3>{a.name}</h3>
                <div className="role">{a.role}</div>
                <p>{a.bio}</p>
              </div>
            ))}
          </div>

          <div className="contact-card">
            <h3>Get in touch</h3>
            <div className="contact-owner">{SITE.owner}</div>
            <div className="contact-row">
              <span className="ico">📞</span>
              <div><small>Phone</small><a href={SITE.phoneHref}>{SITE.phone}</a></div>
            </div>
            <div className="contact-row">
              <span className="ico">📍</span>
              <div><small>Address</small><span>{SITE.address}</span></div>
            </div>
            <div className="contact-row">
              <span className="ico">📌</span>
              <div><small>Pin code</small><span>{SITE.pincode}</span></div>
            </div>
            <div className="contact-row">
              <span className="ico">@</span>
              <div><small>Email</small><a href={"mailto:" + SITE.email}>{SITE.email}</a></div>
            </div>
            <a className="btn" href="about/about.html" style={{ display: "inline-block", marginTop: "16px" }}>
              Full about page →
            </a>
          </div>
        </div>
      </section>

      <section id="newsletter" className="newsletter">
        <div className="container">
          <h2>Subscribe to newsletter</h2>
          <p style={{ color: "var(--muted)", margin: "8px 0 0" }}>Get new posts in your inbox.</p>
          <form onSubmit={subscribe}>
            <input type="email" placeholder="you@example.com" aria-label="Email for newsletter"
              value={email} onChange={e => setEmail(e.target.value)} />
            {" "}
            <button className="btn" type="submit">Subscribe</button>
          </form>
          {msg.t && <p className={msg.ok ? "msg msg-ok" : "msg msg-err"} style={{ marginTop: "10px" }}>{msg.t}</p>}
        </div>
      </section>

      <footer className="footer container" id="contact">
        <div><b>{SITE.name}</b><br />© 2026 {SITE.owner}. All rights reserved.</div>
        <div id="about">
          About<br />
          <a href="about/about.html">Full about page</a><br />
          Categories<br />
          <a href={SITE.phoneHref}>{SITE.phone}</a>
        </div>
        <div>
          {SITE.address}<br />Pin code — {SITE.pincode}<br />
          <a href="auth/auth.html">Login / Sign up</a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
